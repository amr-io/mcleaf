name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-terraform:
    name: Validate Terraform IaaS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
      - name: Terraform Format
        run: |
          cd terraform
          terraform fmt -check -diff
      - name: Validate Terraform Configuration
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate
  lint-ansible:
    name: Validate Ansible & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26
        with:
          working_directory: "ansible"
          requirements_file: "requirements.yml"
  build:
    name: Ensure Overleaf Image Exists
    needs: [lint-ansible, lint-terraform]
    uses: ./.github/workflows/docker.yml
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      security-events: write

    
  deploy:
    name: Configure Azure VM via Ansible
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ansible and Collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n  StrictHostKeyChecking accept-new\n" > ~/.ssh/config
      - name: Generate Dynamic Inventory
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          cat <<EOF > ansible/inventory/hosts.ini
          [webservers]
          latex-vm ansible_host=${VM_HOST} ansible_user=${VM_USER} ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_python_interpreter=/usr/bin/python3
          EOF
      - name: Execute Ansible Playbook
        env:
          # For now, we're using the same env secrets for both environments---should perhaps change later!
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cd ansible
          ansible-playbook -i inventory/hosts.ini playbooks/site.yml
