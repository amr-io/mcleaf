name: CI - Build & Publish TeX Live Full Image to GHCR

on:
  push:
    branches: [main, dev]
    paths:
      - "docker/**"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repo owner
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/sharelatex:5.0.4-with-texlive-full
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/sharelatex:5.0.4-texlive-full
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/sharelatex:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
