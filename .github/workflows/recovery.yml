name: Disaster Recovery (Overleaf Restore)

on:
  workflow_dispatch:
    inputs:
      backup_archive:
        description: "Backup archive name (Leave blank for latest)"
        required: false
        type: string
        default: ""

jobs:
  disaster-recovery:
    name: Execute Disaster Recovery on VM
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n  StrictHostKeyChecking accept-new\n" > ~/.ssh/config
      - name: Execute Remote Restore Script
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          BACKUP_ARCHIVE: ${{ inputs.BACKUP_ARCHIVE }}
        run: |
          ssh -i ~/.ssh/id_rsa ${VM_USER}@${VM_HOST} "sudo -u ${VM_USER} -H /home/${VM_USER}/scripts/restore-overleaf.sh '${BACKUP_ARCHIVE}'"
