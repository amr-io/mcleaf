---
# Deployment dir
overleaf_install_dir: "/home/{{ ansible_user }}/overleaf-toolkit"
overleaf_repo_url: "https://github.com/overleaf/toolkit.git"
overleaf_repo_version: "{{ overleaf_toolkit_ref }}"

# Container image & version
overleaf_image_name: "ghcr.io/amr-io/sharelatex"
overleaf_image_tag: "{{ overleaf_version }}-{{ overleaf_image_suffix }}"

# Application branding & URLs
overleaf_app_name: "Mindcracked's Overleaf"
overleaf_site_url: "http://{{ ansible_host }}"
overleaf_secure_cookie: "false" # Set to true later in Nginx role

# Memory
overleaf_node_options: "--max-old-space-size=256"
