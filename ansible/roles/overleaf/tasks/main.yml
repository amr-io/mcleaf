---
# =============================================
# Clones official Overleaf Community Edition toolkit
# Applies strict memory limits for MongoDB/Redis
# deploys app env conf, and boots the microservices
# =============================================

# ===== Clone Toolkit & Prepare config dir =====
- name: Clone/Update Overleaf CE toolkit repo
  ansible.builtin.git:
    repo: "{{ overleaf_repo_url }}"
    dest: "{{ overleaf_install_dir }}"
    version: "{{ overleaf_repo_version }}"
    update: true
  become: false

- name: Ensure Overleaf conf dir exists
  ansible.builtin.file:
    path: "{{ overleaf_install_dir }}/config"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create Overleaf invite secret
  ansible.builtin.shell: |
    set -o pipefail
    val=$(grep -m 1 '^OVERLEAF_INVITE_TOKEN_SECRET=' {{ overleaf_install_dir }}/config/variables.env 2>/dev/null | cut -d= -f2- | sed "s/['\"]//g")
    echo "${val:-$(openssl rand -base64 32)}"
  args:
    executable: /bin/bash
  register: overleaf_token
  changed_when: false
  no_log: true

# ===== Pre-Upgrade Safety Backup =====
- name: Check if 'version' file exists
  ansible.builtin.stat:
    path: "{{ overleaf_install_dir }}/config/version"
  register: overleaf_version_file

- name: Read current version
  ansible.builtin.slurp:
    src: "{{ overleaf_install_dir }}/config/version"
  register: overleaf_current_version_raw
  when: overleaf_version_file.stat.exists

- name: Check backup systemd
  ansible.builtin.stat:
    path: /etc/systemd/system/latex-backup.service
  register: overleaf_backup_service

- name: Backup data
  ansible.builtin.systemd_service:
    name: latex-backup.service
    state: started
  when:
    - overleaf_version_file.stat.exists
    - overleaf_backup_service.stat.exists
    - (overleaf_current_version_raw.content | b64decode | trim) != overleaf_image_tag

# ===== Deploy production conf & Memory clamps =====
- name: Deploy Overleaf conf templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ overleaf_install_dir }}/config/{{ item.dest }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "version.j2", dest: "version", mode: "0644" }
    - { src: "docker-compose.override.yml.j2", dest: "docker-compose.override.yml", mode: "0644" }
    - { src: "overleaf.rc.j2", dest: "overleaf.rc", mode: "0644" }
    - { src: "variables.env.j2", dest: "variables.env", mode: "0600" }
  notify: Restart overleaf

# ===== Container Stack Startup =====
# bin/up automatically:
# 1- Creates persistent data folders (data/mongo, data/redis, data/overleaf) for the containers
# 2- Init mandatory MongoDB replica set ('overleaf')
# 3- Running 'docker compose up -d' with specified templates
- name: Launch Overvleaf CE container stack
  ansible.builtin.command: bin/up -d
  args:
    chdir: "{{ overleaf_install_dir }}"
  become: false
  changed_when: false

# ===== Version Verification =====
- name: Inspect running container version
  ansible.builtin.command: docker inspect --format '{% raw %}{{.Config.Image}}{% endraw %}' sharelatex
  register: overleaf_running_image
  changed_when: false
  become: false

- name: Verify version match
  ansible.builtin.assert:
    that:
      - (overleaf_running_image.stdout | trim) == (overleaf_image_name ~ ':' ~ overleaf_image_tag)
    fail_msg: >-
      Version mismatch! Expected {{ overleaf_image_name }}:{{ overleaf_image_tag }},
      got {{ overleaf_running_image.stdout | trim }}.
    success_msg: "Verified running ShareLaTeX image: {{ overleaf_running_image.stdout | trim }}"

# ===== Healthcheck =====
# Overleaf microservices: 12 Node processes, Mongo, Redis
- name: Wait for Overleaf web service to become responsive
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000"
    status_code: [200, 302]
  register: overleaf_probe
  until: overleaf_probe.status in [200, 302]
  retries: 24
  delay: 5

- name: Display Overleaf probe status
  ansible.builtin.debug:
    msg: "Overleaf responded with HTTP {{ overleaf_probe.status }}"

# ===== Prune N-1 Images - Retain current and previous images =====
- name: Prune unused Docker images
  ansible.builtin.shell: |
    set -eo pipefail
    docker images -q "{{ overleaf_image_name }}" | uniq | tail -n +3 | xargs -r docker rmi
    docker image prune -f
  args:
    executable: /bin/bash
  register: overleaf_docker_prune
  changed_when: "'Deleted:' in overleaf_docker_prune.stdout or 'Total reclaimed space: 0B' not in overleaf_docker_prune.stdout"
  become: false
