---
# =============================================
# Clones official Overleaf Community Edition toolkit
# Applies strict memory limits for MongoDB/Redis
# deploys app env conf, and boots the microservices
# =============================================

# ===== Clone Toolkit & Prepare config dir =====
- name: Clone Overleaf CE toolkit repo
  ansible.builtin.git:
    repo: "{{ overleaf_repo_url }}"
    dest: "{{ overleaf_install_dir }}"
    version: "{{ overleaf_repo_version }}"
    update: false
  become: false

- name: Ensure Overleaf conf dir exists
  ansible.builtin.file:
    path: "{{ overleaf_install_dir }}/config"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# ===== Deploy production conf & Memory clamps =====
- name: Deploy Overleaf conf templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ overleaf_install_dir }}/config/{{ item.dest }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "version.j2", dest: "version", mode: "0644" }
    - { src: "docker-compose.override.yml.j2", dest: "docker-compose.override.yml", mode: "0644" }
    - { src: "overleaf.rc.j2", dest: "overleaf.rc", mode: "0644" }
    - { src: "variables.env.j2", dest: "variables.env", mode: "0600" }
  notify: Restart overleaf

# ===== Container Stack Startup =====
# bin/up automatically:
# 1- Creates persistent data folders (data/mongo, data/redis, data/overleaf) for the containers
# 2- Init mandatory MongoDB replica set ('overleaf')
# 3- Running 'docker compose up -d' with specified templates
- name: Launch Overvleaf CE container stack
  ansible.builtin.command: bin/up -d
  args:
    chdir: "{{ overleaf_install_dir }}"
  become: false
  changed_when: false

# ===== Healthcheck =====
# Overleaf microservices: 12 Node processes, Mongo, Redis
- name: Wait for Overleaf web service to become responsive
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000"
    status_code: [200, 302]
  register: overleaf_probe
  until: overleaf_probe.status in [200, 302]
  retries: 24
  delay: 5

- name: Display Overleaf probe status
  ansible.builtin.debug:
    msg: "Overleaf responded with HTTP {{ overleaf_probe.status }}"
