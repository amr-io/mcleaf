---
# ===== PACKAGES =====
- name: Install UFW and Fail2ban
  ansible.builtin.apt:
    name: [ufw, fail2ban]
    state: present
    update_cache: false

# ===== FIREWALL (UFW) =====
- name: Set UFW default incoming policy to deny
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow essential traffic
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ security_ufw_allowed_ports }}"

- name: Enable Firewall
  community.general.ufw:
    state: enabled

# ===== Fail2ban =====
- name: Deploy Fail2ban SSH jail conf
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban daemon is running and enabled at boot
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
